<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Mountain Todo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-frame">
        <!-- p5 canvas — full frame, behind everything -->
        <div id="mountain-zone"></div>

        <!-- Date header -->
        <div id="date-header">
            <button id="date-prev" class="date-nav">
                <svg width="9" height="15" viewBox="0 0 9 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.91406 1L1.41406 7.5L7.91406 14" stroke="#888888" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div id="date-display"></div>
            <button id="date-next" class="date-nav" style="transform: rotate(180deg)">
                <svg width="9" height="15" viewBox="0 0 9 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.91406 1L1.41406 7.5L7.91406 14" stroke="#888888" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </div>

        <div id="header-line"></div>

        <!-- Todo list area -->
        <div id="todo-area">
            <ul id="todo-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
