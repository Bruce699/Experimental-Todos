<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Mountain Todo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-frame">
        <!-- p5 canvas — full frame, behind everything -->
        <div id="mountain-zone"></div>

        <!-- Date header -->
        <div id="date-header">
            <button id="date-prev" class="date-nav">
                <img src="chevron-left.svg" alt="prev">
            </button>
            <div id="date-display"></div>
            <button id="date-next" class="date-nav">
                <img src="chevron-left.svg" alt="next" style="transform: rotate(180deg)">
            </button>
        </div>

        <div id="header-line"></div>

        <!-- Todo list area -->
        <div id="todo-area">
            <ul id="todo-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
